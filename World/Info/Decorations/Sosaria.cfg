## CAVE OF VIRTUE (SOSARIA) - TALL CANDELABRA
##
## CandelabraStand is the tall floor candelabra; 12342 is its lit art (0x3036).
## The decoration loader ignites every BaseLight it places (Burning = true, art set to
## LitItemID) and marks it Protected, so players cannot douse these by double-clicking.
## One header, one line per candelabra -- DecorationList reads every coordinate line
## that follows a header until the next blank line.
