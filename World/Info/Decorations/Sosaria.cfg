## CAVE OF VIRTUE ENTRANCE (SOSARIA) - GLOW ON THE ANKHS
##
## StrangeGlow is a transient effect: its constructor starts a 30-second removal timer and
## Deserialize() deletes it when the world loads, so it cannot survive as a decoration.
## GlowingLight is the permanent twin (same art 0x1647, same LightType.Circle300), so the
## ankhs stay illuminated. The ankhs themselves are untouched.
##
